org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# 工程路径含非 ASCII 字符（中文目录）时，AGP 默认会直接报错终止；
# 这个开关按官方提示跳过该检查。若仍失败，请把工程放到纯英文路径再构建。
android.overridePathCheck=true
# Gradle 需要把 native-platform.dll 解压到 java.io.tmpdir 再加载。在受限的沙箱会话里
# TEMP 会被重定向到一个临时目录，导致 "Failed to load native library 'native-platform.dll'"
# （IOException: 系统找不到指定的路径）。这里固定到一个 ASCII 相对路径，绕开该问题。
# 注意：值必须是纯 ASCII（非 ASCII 会破坏 daemon 的 -D 参数解析）。
systemProp.java.io.tmpdir=../.g/tmp
