org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# 工程路径含非 ASCII 字符（中文目录）时，AGP 默认会直接报错终止；
# 这个开关按官方提示跳过该检查。若仍失败，请把工程放到纯英文路径再构建。
android.overridePathCheck=true

# ---------------------------------------------------------------------------
# 关于 java.io.tmpdir（本机沙箱环境才需要，故不写在这里）
#
# Gradle 启动时要把 native-platform.dll 解压到 java.io.tmpdir 再加载。某些受限沙箱
# 会把 TEMP 重定向到不可用目录，导致：
#     Failed to load native library 'native-platform.dll'
#     Caused by: java.io.IOException: 系统找不到指定的路径
#
# 修复方式是在**本机**创建临时目录并覆盖 TEMP（不要写进仓库，否则 CI 会指向不存在的路径）：
#     New-Item -ItemType Directory -Force "<仓库同级>\<纯ASCII目录>\tmp" | Out-Null
#     $env:TEMP = "<仓库同级>\<纯ASCII目录>\tmp"
#     $env:TMP  = $env:TEMP
# 注意路径必须是纯 ASCII（非 ASCII 会破坏 Gradle daemon 的 -D 参数解析）。
# ---------------------------------------------------------------------------
