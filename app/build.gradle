plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dsh.nahangfix'
    compileSdk 34

    defaultConfig {
        applicationId "com.dsh.nahangfix"
        minSdk 21
        targetSdk 34
        versionCode 4
        versionName "1.3.0"
    }

    buildTypes {
        debug {
            // 便于直接安装：debug 包使用默认调试签名
        }
        release {
            minifyEnabled false
            shrinkResources false
            // 未配置正式签名时，release 也复用 debug 签名，保证产物可直接安装
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Xposed API 只在编译期使用，运行期由 Xposed/LSPosed 提供
    compileOnly 'de.robv.android.xposed:api:82'
}
