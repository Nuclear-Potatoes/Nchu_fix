name: build-apk

# 本机没有 JDK/Android SDK 时，可以把本目录作为仓库根目录推送到 GitHub，
# 用这套工作流直接产出可安装的 APK（在 Actions 的 Artifacts 里下载）。
#
# 注意：仓库里已包含 Gradle Wrapper（gradlew / gradlew.bat / gradle-wrapper.jar），
# 因此这里统一用 ./gradlew，保证本地与 CI 使用完全相同的 Gradle 版本（9.8）。

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 使用仓库自带的 gradlew；setup-gradle 负责缓存，不必再指定版本
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NahangFix-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
